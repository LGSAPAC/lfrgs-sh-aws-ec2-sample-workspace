#
# Shared by every Liferay node on EC2, in the Docker image and in the Tomcat bundle.
#
# Host-specific settings (database, search, clustering, Documents and Media,
# virtual host) are NOT here: the tutorial's bootstrap script renders them into
# portal-ext.properties on each instance, and that file includes this one.
#

# Show the node name at the bottom of every page, so you can see which EC2
# instance served a request. Turn it off for production.
web.server.display.node=true
