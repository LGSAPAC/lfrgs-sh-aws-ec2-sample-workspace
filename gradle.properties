## Check GETTING_STARTED.md for additional properties and their default values.
##

liferay.workspace.bundle.dist.include.metadata=true
liferay.workspace.modules.dir=modules

# Node.js for client extensions: Node 22 LTS. The codename is case-sensitive ("Jod", not "jod"). Vite 8 needs Node 20.19+ or 22.12+,
# newer than the workspace's default download.
liferay.workspace.node.lts.codename=Jod

# Build each client extension with npm. With the default (yarn), a second root task downloads
# the workspace's default Node (20.12.2) over the one above, and Vite 8 fails on it.
liferay.workspace.node.package.manager=npm
liferay.workspace.themes.dir=themes
liferay.workspace.wars.dir=modules
microsoft.translator.subscription.key=
liferay.workspace.product=dxp-2026.q1.13-lts